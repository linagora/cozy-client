version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    commit-message:
      # Prefix all commit messages with "fix"
      prefix: "fix"
    schedule:
      interval: "weekly"
      day: "saturday"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "chore"
    schedule:
      interval: "weekly"
      day: "saturday"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
