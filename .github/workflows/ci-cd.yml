name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on master, it may be publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ github.ref == 'refs/heads/master' && secrets.GH_TOKEN || github.token }}
          persist-credentials: false
          fetch-depth: 0
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Build
        run: yarn build # before tests since packages rely on dist/ files to be available
      - name: Test
        run: yarn test --runInBand
      - name: Make documentation
        run: yarn docs
      - name: Check documentation
        run: |
          git add -A -- docs
          git diff --cached --exit-code -- docs || (echo "Docs are not up-to-date, please run yarn docs and repush" && exit 1)
      - name: Make types
        run: yarn types
      - name: Check types
        run: |
          git add -A
          git diff --cached --exit-code || (echo "Types are not up-to-date, please run cd packages/cozy-client && yarn typecheck and repush" && exit 1)
      - name: Publish to NPM
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          git config user.name "Cozy Bot"
          git config user.email "npm@cozycloud.cc"
          git remote set-url origin https://cozy-bot:$GH_TOKEN@github.com/cozy/cozy-client.git
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
          yarn lerna publish --yes -m "chore: Publish [skip ci]"

  perf:
    name: Performance benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Don't leave the workflow token in .git/config where the untrusted
          # PR code we run below (yarn install / yarn bench) could read it. The
          # comment step posts via github-script's ambient token, not git.
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Record PR ref
        id: prref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install dependencies (PR)
        run: yarn install --immutable
      - name: Benchmark PR
        run: yarn bench --out=pr.bench.json
      - name: Checkout base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git checkout --force "$BASE_SHA"
      - name: Install dependencies (base)
        run: yarn install --immutable
      - name: Benchmark base (same runner)
        # Only tolerate the "base branch has no benchmarks yet" bootstrap case;
        # a real bench failure (bad build/install) must still fail the job
        # rather than being masked into a missing baseline.
        run: |
          if [ -f packages/cozy-client/benchmarks/run.js ]; then
            yarn bench --out=base.bench.json
          else
            echo "No baseline on base branch (benchmarks are new)."
          fi
      - name: Restore PR tree
        env:
          PR_SHA: ${{ steps.prref.outputs.sha }}
        run: git checkout --force "$PR_SHA"
      - name: Compare PR vs base
        id: compare
        run: |
          set +e
          node packages/cozy-client/benchmarks/compare.js base.bench.json pr.bench.json --md=perf-comment.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Write benchmark summary
        if: always()
        run: cat perf-comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post benchmark comment
        # Fork pull requests get a read-only GITHUB_TOKEN and cannot comment.
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- cozy-client-benchmarks -->'
            const body = `${marker}\n${fs.readFileSync('perf-comment.md', 'utf8')}`
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            })
            const existing = comments.find(c => c.body && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              })
            }
      - name: Fail on regression
        if: steps.compare.outputs.status != '0'
        run: |
          echo "A guarded benchmark regressed beyond its threshold."
          exit 1